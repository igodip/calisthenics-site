<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calisync Trainee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="wrap">
    <auth-view v-if="!session"></auth-view>

    <div v-else class="app-shell trainee-shell">
        <trainee-sidebar></trainee-sidebar>
        <main class="main trainee-main">
            <trainee-topbar></trainee-topbar>

            <div v-if="!current" class="card">
                <h2>{{ t('sections.trainees') }}</h2>
                <p class="muted">{{ hasBootstrapped ? t('trainees.detailNotFound') : t('status.loadingExercises') }}</p>
            </div>

            <template v-else>
                <trainee-profile-header></trainee-profile-header>
                <trainee-overview v-if="currentTraineeTab==='overview'"></trainee-overview>
                <trainee-plan-builder v-else-if="currentTraineeTab==='plans'"></trainee-plan-builder>
                <trainee-history v-else></trainee-history>
            </template>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.5.136/build/pdf.min.mjs';
    window.pdfjsLib = pdfjsLib;
</script>
<script>
    (function(){
      function add(src){ var s=document.createElement('script'); s.src=src; s.crossOrigin='anonymous'; document.head.appendChild(s); }
      window.addEventListener('error', function(){}, true);
      setTimeout(function(){
        if(!window.Vue){
          add('https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.min.js');
        }
        if(!window.supabase || !window.supabase.createClient){
          add('https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js');
        }
      }, 300);
    })();
</script>
<script src="./app-config.local.js"></script>
<script type="module" src="./supabase-bridge.js"></script>
<script type="module" src="./app.js"></script>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
