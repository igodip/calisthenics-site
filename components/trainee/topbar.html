<div class="topbar trainee-topbar">
    <div class="page-heading">
        <button class="icon-button navigation-toggle" type="button" @click="navigationOpen=true" :aria-label="t('navigation.openMenu')">☰</button>
        <div>
            <div class="eyebrow">{{ t('sections.trainees') }} / {{ t(`traineeTabs.${currentTraineeTab}`) }}</div>
            <h1 class="page-title">{{ current ? (current.displayName || shortId(current.id)) : t('sections.trainees') }}</h1>
            <div class="page-description">{{ t('trainees.detailSubtitle') }}</div>
        </div>
    </div>
    <div class="toolbar-secondary trainee-toolbar">
        <button class="btn ghost" type="button" @click="goToTraineesPage">{{ t('actions.backToTrainees') }}</button>
        <button
            class="icon-button theme-toggle"
            type="button"
            @click="toggleTheme"
            :aria-label="theme === 'dark' ? t('toolbar.themeLight') : t('toolbar.themeDark')"
            :title="theme === 'dark' ? t('toolbar.themeLight') : t('toolbar.themeDark')"
        >
            <span aria-hidden="true">{{ theme === 'dark' ? '☀' : '☾' }}</span>
        </button>
        <select v-model="locale" class="pill" :aria-label="t('toolbar.language')">
            <option v-for="option in languageOptions" :key="option.value" :value="option.value">{{ option.label }}</option>
        </select>
        <button class="btn soft" @click="signOut">{{ t('actions.signOut') }}</button>
    </div>
</div>
